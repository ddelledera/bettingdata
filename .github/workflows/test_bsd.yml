name: Test BSD

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Esegui test
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: python test_bsd.py
