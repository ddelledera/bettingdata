# Questo file fa succedere una cosa "magica": ogni giorno, in automatico e
# gratis, un computer nel cloud scarica i dati nuovi, li allena col modello,
# e salva i risultati aggiornati — senza che tu debba accendere nulla.
#
# Non serve capire questo file. Va semplicemente caricato così com'è.

name: Aggiorna dati e previsioni

on:
  schedule:
    - cron: "0 6 * * *"   # ogni giorno alle 6:00 (ora UTC)
  workflow_dispatch:        # permette anche di farlo partire manualmente dal sito GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del progetto
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le librerie necessarie
        run: pip install -r requirements.txt

      - name: Aggiorna storico partite
        run: python ingest_historical.py

      - name: Scarica partite in arrivo
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch_fixtures.py

      - name: Aggiorna risultati Champions League (per collegare i campionati)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python ingest_european_cups.py

      - name: Scarica quote live
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_odds.py

      - name: Scarica partite e quote Champions/Europa/Conference
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python fetch_european_odds.py

      - name: Calcola le nuove previsioni
        run: python run_model.py

      - name: Salva i dati aggiornati nel progetto
        run: |
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@github.com"
          git add data.db
          git diff --staged --quiet || git commit -m "Aggiornamento dati automatico"
          git push
